<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3d5a80">
  <title>Rider Assignments | LAAM Express</title>
  <link rel="stylesheet" href="/features/sprint2/US02/css/styles.css">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script type="module" src="/features/sprint2/US02/js/main.js"></script>
</head>
<body>
  <header class="rider-header">
    <div class="header-inner">
      <div class="brand"><span>LAAM <strong>EXPRESS</strong></span><small>RIDER PORTAL</small></div>
      <a class="header-home" href="/">Home</a>
    </div>
  </header>

  <main class="rider-workspace">
    <section id="route-screen" aria-labelledby="route-title">
      <div class="screen-heading">
        <span class="heading-icon route-icon" aria-hidden="true">📍</span>
        <div>
          <h1 id="route-title" tabindex="-1">Route stops</h1>
          <p>Follow the numbered stops for each day.</p>
        </div>
      </div>
      <p id="route-message" class="state-message" role="status">Loading assignments…</p>
      <div id="route-list" class="route-list" aria-busy="true"></div>
    </section>

    <section id="detail-screen" class="detail-screen" aria-labelledby="detail-title" hidden>
      <div class="detail-heading">
        <button type="button" id="back-to-assignments" class="back-btn" aria-label="Back to route stops">←</button>
        <h2 id="detail-title" tabindex="-1">Assignment details</h2>
      </div>
      <div class="detail-task-header">
        <strong id="detail-task-id"></strong>
        <span id="detail-status" class="status-badge"></span>
      </div>
      <div class="detail-body">
        <div class="detail-group">
          <h3 id="detail-location-title">Location</h3>
          <div class="detail-value-box"><p id="detail-location"></p></div>
        </div>
        <div class="detail-group" id="detail-appointment" hidden>
          <h3>Pickup appointment</h3>
          <div class="detail-value-box"><p id="detail-time"></p></div>
        </div>
        <div class="detail-group customer-contact-group" aria-labelledby="contact-title">
          <h3 id="contact-title">Customer contact</h3>
          <p id="contact-message" class="contact-message" role="status"></p>
          <div id="contact-content" class="customer-phone-box" hidden>
            <div class="customer-phone-information">
              <strong id="customer-phone"></strong>
              <span>Customer phone number</span>
            </div>
            <a id="call-customer" class="customer-call-button" aria-label="Call customer"><span aria-hidden="true">☎</span></a>
          </div>
        </div>
      </div>
    </section>

    <section id="settings-screen" class="settings-screen" aria-labelledby="settings-title" hidden>
      <div class="screen-heading">
        <span class="heading-icon settings-icon" aria-hidden="true">⚙</span>
        <h1 id="settings-title" tabindex="-1">Settings</h1>
      </div>
      <div class="profile-card" id="rider-profile">
        <h2>My account</h2>
        <strong data-account-name></strong>
        <p data-account-email></p>
        <button type="button" class="site-secondary" data-open-password>Change password</button>
        <button type="button" class="site-primary" data-logout>Log out</button>
        <p role="alert" data-account-error hidden></p>
      </div>
    </section>
  </main>

  <nav class="bottom-navbar" aria-label="Rider workspace">
    <button type="button" id="nav-route" class="nav-item active" aria-current="page">
      <span class="nav-icon" aria-hidden="true">📋</span><span>Route stops</span>
    </button>
    <button type="button" id="nav-settings" class="nav-item">
      <span class="nav-icon" aria-hidden="true">⚙</span><span>Settings</span>
    </button>
  </nav>
</body>
</html>
